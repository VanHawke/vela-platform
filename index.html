<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safari-safe favicon bootstrap: runs synchronously during HTML parse,
      // BEFORE any <link rel="icon"> is encountered. Creates the favicon link
      // element from scratch using localStorage override if present, else default.
      // This pattern is the only reliable way to apply a dynamic favicon in Safari.
      (function () {
        try {
          var custom = null;
          try { custom = localStorage.getItem('custom_favicon_url'); } catch (_) {}
          var href = custom || '/kiko-icon-192.png?v=2';
          var mime = href.indexOf('.svg') !== -1 ? 'image/svg+xml' : 'image/png';
          var l1 = document.createElement('link');
          l1.rel = 'icon'; l1.type = mime; l1.href = href;
          document.head.appendChild(l1);
          var l2 = document.createElement('link');
          l2.rel = 'shortcut icon'; l2.type = mime; l2.href = href;
          document.head.appendChild(l2);
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/kiko-icon-192.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FEFEFC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiko" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap" rel="stylesheet">
    <title>Kiko</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}</script>
  </body>
</html>
