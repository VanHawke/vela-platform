<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kiko — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F0EFEB;--white:#FFF;--blue:#4A7FF8;--blue-light:#E3ECFF;--orange:#FF7648;--amber:#FFC757;--text:#202020;--text-2:#5A5A5A;--text-3:#8E8E8E;--text-4:#B5B5B5;--r:20px;--r-sm:14px;--pill:50px;--font:'Outfit',-apple-system,sans-serif}
body{background:var(--bg);font-family:var(--font);color:var(--text);height:100vh;display:flex;align-items:center;justify-content:center}
input{font-family:var(--font)}
input:focus{outline:none;border-color:var(--blue)}
</style>
</head>
<body>
<div style="width:400px;display:flex;flex-direction:column;align-items:center">
  <!-- ORB -->
  <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#7B6CF6,var(--orange));box-shadow:0 12px 40px rgba(74,127,248,0.18);margin-bottom:24px"></div>
  <div style="font-size:32px;font-weight:300;letter-spacing:-0.04em;margin-bottom:6px">Kiko</div>
  <p style="font-size:14px;color:var(--text-3);margin-bottom:36px">Your AI operating system</p>

  <!-- CARD -->
  <div style="width:100%;background:var(--white);border-radius:var(--r);padding:32px;box-shadow:0 2px 12px rgba(0,0,0,0.04)">
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:8px">Email</label>
      <input type="email" placeholder="sunny@vanhawke.com" style="width:100%;padding:13px 18px;background:var(--bg);border:1.5px solid rgba(0,0,0,0.06);border-radius:var(--r-sm);font-size:14px;color:var(--text)">
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:8px">Password</label>
      <input type="password" placeholder="Enter password" style="width:100%;padding:13px 18px;background:var(--bg);border:1.5px solid rgba(0,0,0,0.06);border-radius:var(--r-sm);font-size:14px;color:var(--text)">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);cursor:pointer"><input type="checkbox" style="accent-color:var(--blue);width:16px;height:16px;border-radius:4px"> Remember me</label>
      <a style="font-size:13px;color:var(--blue);text-decoration:none;cursor:pointer">Forgot password?</a>
    </div>
    <button style="width:100%;padding:14px;border:none;border-radius:var(--pill);background:var(--blue);font-size:15px;font-weight:500;color:white;font-family:var(--font);cursor:pointer;box-shadow:0 4px 16px rgba(74,127,248,0.25)">Sign in</button>

    <div style="display:flex;align-items:center;gap:16px;margin:24px 0">
      <div style="flex:1;height:1px;background:rgba(0,0,0,0.06)"></div>
      <span style="font-size:12px;color:var(--text-4)">or</span>
      <div style="flex:1;height:1px;background:rgba(0,0,0,0.06)"></div>
    </div>

    <button style="width:100%;padding:13px;border:1.5px solid rgba(0,0,0,0.06);border-radius:var(--pill);background:var(--white);font-size:14px;color:var(--text-2);font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
  </div>

  <div style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-3)">Don't have an account? <a style="color:var(--blue);text-decoration:none;font-weight:500;cursor:pointer">Get started</a></div>
</div>
</body></html>
