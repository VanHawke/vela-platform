<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiko · Nav Option B — Top + Sidebar (Linear style)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FEFEFC;
    --bg-card: #FFFFFF;
    --bg-tinted: #F5F4F1;
    --bg-sidebar: #FAFAF7;
    --surface: rgba(0,0,0,0.03);
    --surface-hover: rgba(0,0,0,0.05);
    --text: #0A0A0A;
    --text-dim: #6B6B6B;
    --text-faint: #A0A0A0;
    --accent: #0A0A0A;
    --border: rgba(0,0,0,0.08);
    --border-subtle: rgba(0,0,0,0.05);
    --border-hover: rgba(0,0,0,0.14);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.05);
    --r-cta: 4px;
    --r-input: 16px;
    --r-pill: 24px;
    --r-side: 8px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --font-display: 'Source Serif 4', Georgia, serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-weight: 450; font-size: 13px; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; }
  button, a { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-decoration: none; }
  input, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }

  .opt-switcher { position: fixed; top: 12px; left: 12px; z-index: 100; display: flex; gap: 4px; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: var(--r-cta); padding: 4px; box-shadow: var(--shadow-md); font-size: 11px; }
  .opt-switcher a { padding: 4px 10px; border-radius: 3px; color: var(--text-dim); transition: background 0.15s, color 0.15s; }
  .opt-switcher a:hover { background: var(--surface); color: var(--text); }
  .opt-switcher a.active { background: var(--accent); color: white; }

  .app { display: grid; grid-template-columns: 224px 1fr; grid-template-rows: 52px 1fr; height: 100vh; transition: grid-template-columns 0.22s var(--ease); }
  .app.collapsed { grid-template-columns: 56px 1fr; }

  /* Top bar */
  .topbar { grid-column: 1 / -1; height: 52px; background: var(--bg); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 64px; z-index: 30; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .menu-toggle { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-cta); color: var(--text-dim); transition: background 0.15s, color 0.15s; }
  .menu-toggle:hover { background: var(--surface); color: var(--text); }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 22px; height: 22px; color: var(--text); }
  .brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 400; letter-spacing: 0.04em; }
  .topbar-right { display: flex; align-items: center; gap: 6px; }
  .cmd-k { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; border: 1px solid var(--border); border-radius: var(--r-cta); color: var(--text-dim); font-size: 12.5px; min-width: 240px; transition: border-color 0.15s; }
  .cmd-k:hover { border-color: var(--border-hover); }
  .cmd-k-text { flex: 1; text-align: left; }
  .cmd-k-key { font-family: ui-monospace, monospace; font-size: 10.5px; padding: 1px 6px; background: var(--surface); border-radius: 3px; color: var(--text); }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-cta); color: var(--text-dim); position: relative; transition: background 0.15s, color 0.15s; }
  .icon-btn:hover { background: var(--surface); color: var(--text); }
  .icon-btn .dot { position: absolute; top: 7px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: #b8643e; box-shadow: 0 0 0 2px var(--bg); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: white; display: grid; place-items: center; font-size: 11px; font-weight: 500; margin-left: 4px; }

  /* Sidebar */
  .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); overflow-y: auto; overflow-x: hidden; padding: 16px 12px 18px; display: flex; flex-direction: column; gap: 2px; }
  .app.collapsed .sidebar { padding: 16px 8px; }
  .nav-section-label { font-size: 10.5px; font-weight: 500; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; padding: 16px 10px 6px; transition: opacity 0.15s; }
  .app.collapsed .nav-section-label { opacity: 0; height: 0; padding: 0; overflow: hidden; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-side); color: var(--text-dim); font-size: 13px; font-weight: 450; transition: background 0.15s, color 0.15s; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--accent); color: white; font-weight: 500; }
  .nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-label { flex: 1; transition: opacity 0.15s; }
  .app.collapsed .nav-label { opacity: 0; }
  .nav-badge { font-size: 10.5px; color: var(--text-faint); font-weight: 500; transition: opacity 0.15s; }
  .nav-item.active .nav-badge { color: rgba(255,255,255,0.65); }
  .app.collapsed .nav-badge { opacity: 0; }
  .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .org-switcher { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-side); cursor: pointer; transition: background 0.15s; }
  .org-switcher:hover { background: var(--surface); }
  .org-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: white; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .org-info { flex: 1; min-width: 0; transition: opacity 0.15s; }
  .app.collapsed .org-info { opacity: 0; }
  .org-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .org-tier { font-size: 10.5px; color: var(--text-faint); }

  /* Main content */
  .main { overflow-y: auto; background: var(--bg); position: relative; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .bg-orbs { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: drift 28s ease-in-out infinite; }
  .orb-1 { width: 480px; height: 480px; background: radial-gradient(circle, #E8DCC4 0%, transparent 70%); top: -8%; left: -6%; opacity: 0.5; }
  .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, #D89472 0%, transparent 70%); top: 18%; right: -8%; opacity: 0.18; animation-delay: -10s; }
  .orb-3 { width: 320px; height: 320px; background: radial-gradient(circle, #B5BFA0 0%, transparent 70%); bottom: 5%; left: 30%; opacity: 0.22; animation-delay: -18s; }
  @keyframes drift { 0%, 100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,-25px) scale(1.05); } 66% { transform: translate(-25px,35px) scale(0.95); } }

  .hero { max-width: 760px; width: 100%; text-align: center; position: relative; z-index: 1; }
  .eyebrow { font-size: 12px; color: var(--text-dim); margin-bottom: 22px; }
  .eyebrow strong { color: var(--text); font-weight: 500; }
  .title { font-family: var(--font-display); font-weight: 300; font-size: clamp(56px, 6.5vw, 88px); line-height: 0.95; letter-spacing: -0.02em; color: var(--text); margin-bottom: 18px; }
  .subtitle { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin-bottom: 40px; }

  .prompt-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-input); box-shadow: var(--shadow-sm); padding: 16px 18px 12px; transition: border-color 0.15s, box-shadow 0.2s; text-align: left; }
  .prompt-card:focus-within { border-color: var(--text); box-shadow: 0 0 0 3px rgba(10,10,10,0.04); }
  .prompt-input { width: 100%; min-height: 28px; font-size: 14px; color: var(--text); background: transparent; resize: none; line-height: 1.5; padding: 4px 0; }
  .prompt-input::placeholder { color: var(--text-faint); }
  .prompt-toolbar { display: flex; align-items: center; gap: 6px; padding-top: 12px; margin-top: 6px; border-top: 1px solid var(--border-subtle); }
  .source-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--surface); border-radius: var(--r-pill); font-size: 11.5px; font-weight: 450; color: var(--text); transition: background 0.15s; }
  .source-pill:hover { background: var(--surface-hover); }
  .source-pill svg { width: 11px; height: 11px; }
  .source-pill .plus { color: var(--text-faint); margin-left: 1px; }
  .prompt-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .prompt-icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--text-dim); transition: background 0.15s, color 0.15s; }
  .prompt-icon-btn:hover { background: var(--surface); color: var(--text); }
  .prompt-send { width: 30px; height: 30px; background: var(--accent); color: white; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 0 rgba(10,10,10,0.15); animation: sendPulse 3s ease-in-out infinite; }
  .prompt-send:hover { animation: none; opacity: 0.85; }
  @keyframes sendPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(10,10,10,0.18); } 50% { box-shadow: 0 0 0 6px rgba(10,10,10,0); } }

  .chips { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--bg-card); font-size: 12.5px; color: var(--text); transition: background 0.15s, border-color 0.15s, transform 0.15s; }
  .chip:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-1px); }
</style>
</head>
<body>

<div class="opt-switcher">
  <a href="kiko-home-nav-a.html">A · Top bar only</a>
  <a class="active">B · Top + sidebar (Linear)</a>
  <a href="kiko-home-nav-c.html">C · Sidebar only</a>
</div>

<div class="app" id="app">

  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="document.getElementById('app').classList.toggle('collapsed')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 7.5L21 11l-7.5 1.5L12 20l-1.5-7.5L3 11l7.5-1.5L12 2z"/></svg>
        <span class="brand-name">Kiko</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="cmd-k">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="cmd-k-text">Search or jump to…</span>
        <kbd class="cmd-k-key">⌘K</kbd>
      </button>
      <button class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot"></span></button>
      <div class="avatar">S</div>
    </div>
  </div>

  <aside class="sidebar">
    <a class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      <span class="nav-label">Today</span>
      <span class="nav-badge">12</span>
    </a>
    <a class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      <span class="nav-label">Inbox</span><span class="nav-badge">3</span>
    </a>
    <a class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span class="nav-label">Pipeline</span><span class="nav-badge">$73m</span>
    </a>
    <a class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span class="nav-label">Campaigns</span><span class="nav-badge">8</span>
    </a>
    <a class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span class="nav-label">Contacts</span><span class="nav-badge">247</span>
    </a>
    <div class="nav-section-label">Intelligence</div>
    <a class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span class="nav-label">Signals</span><span class="nav-badge">311</span></a>
    <a class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="nav-label">Partnerships</span></a>
    <a class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="nav-label">Calendar</span></a>
    <div class="sidebar-footer">
      <div class="org-switcher">
        <div class="org-mark">VH</div>
        <div class="org-info"><div class="org-name">Van Hawke Group</div><div class="org-tier">Workspace</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="hero">
      <div class="eyebrow"><strong>Wednesday · 15 April</strong></div>
      <h1 class="title">Good morning, Sunny.</h1>
      <p class="subtitle">What should we work on today?</p>
      <div class="prompt-card">
        <textarea class="prompt-input" id="promptInput" rows="1" placeholder="Ask Kiko anything…"></textarea>
        <div class="prompt-toolbar">
          <button class="source-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>Web</button>
          <button class="source-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>LinkedIn</button>
          <button class="source-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/></svg>Pipeline</button>
          <button class="source-pill">Add <span class="plus">+</span></button>
          <div class="prompt-actions">
            <button class="prompt-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
            <button class="prompt-send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
          </div>
        </div>
      </div>
      <div class="chips">
        <button class="chip" onclick="fillPrompt(this)">Brief me on Mark Tucker</button>
        <button class="chip" onclick="fillPrompt(this)">Show pipeline this week</button>
        <button class="chip" onclick="fillPrompt(this)">Draft Gaming sequence</button>
        <button class="chip" onclick="fillPrompt(this)">What's hot in inbox?</button>
      </div>
    </div>
  </main>
</div>

<script>
const placeholders = ["Ask Kiko anything…", "Brief me on James Bardrick…", "Find banks renewing F1 contracts in 2026…", "Show pipeline movement…", "Draft a sequence for Gaming…"];
const input = document.getElementById('promptInput');
let phI = 0, charI = 0, typing = true;
function typeLoop() {
  if (document.activeElement === input || input.value.length > 0) { setTimeout(typeLoop, 1500); return; }
  const target = placeholders[phI];
  if (typing) { if (charI <= target.length) { input.placeholder = target.substring(0, charI) + (charI < target.length ? '▌' : ''); charI++; setTimeout(typeLoop, 35); } else { typing = false; setTimeout(typeLoop, 2500); } }
  else { if (charI > 0) { charI--; input.placeholder = target.substring(0, charI) + '▌'; setTimeout(typeLoop, 18); } else { typing = true; phI = (phI + 1) % placeholders.length; setTimeout(typeLoop, 200); } }
}
setTimeout(typeLoop, 800);
function fillPrompt(btn) { input.value = btn.textContent.trim(); input.focus(); }
</script>
</body>
</html>
