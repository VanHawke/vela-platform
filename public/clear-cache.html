<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kiko — Cache Reset</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Inter, system-ui, sans-serif; background: #FEFEFC; padding: 40px 24px; }
h1 { font-family: Georgia, serif; font-size: 24px; font-weight: 400; margin-bottom: 24px; }
.log { font-size: 13px; line-height: 2; color: #6B6B6B; }
.ok { color: #3B6D11; }
.fail { color: #A32D2D; }
.status { font-size: 11px; background: #F5F4F1; padding: 12px 16px; border-radius: 12px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
a { display: inline-block; margin-top: 24px; padding: 12px 24px; background: #0A0A0A; color: #FEFEFC; text-decoration: none; border-radius: 24px; font-size: 14px; }
</style>
</head>
<body>
<h1>Kiko cache reset</h1>
<div class="log" id="log"></div>
<div class="status" id="status"></div>

<script>
var log = document.getElementById('log');
var status = document.getElementById('status');

function addLog(msg, ok) {
  var p = document.createElement('div');
  p.className = ok ? 'ok' : (ok === false ? 'fail' : '');
  p.textContent = (ok ? '✓ ' : ok === false ? '✗ ' : '→ ') + msg;
  log.appendChild(p);
}

async function run() {
  var swCount = 0;
  var cacheCount = 0;
  
  // 1. Unregister service workers
  if ('serviceWorker' in navigator) {
    try {
      var regs = await navigator.serviceWorker.getRegistrations();
      swCount = regs.length;
      for (var i = 0; i < regs.length; i++) {
        await regs[i].unregister();
      }
      addLog('Unregistered ' + swCount + ' service worker(s)', true);
    } catch(e) {
      addLog('SW unregister failed: ' + e.message, false);
    }
  } else {
    addLog('No service worker support', null);
  }

  // 2. Delete all caches
  if (window.caches) {
    try {
      var keys = await caches.keys();
      cacheCount = keys.length;
      for (var j = 0; j < keys.length; j++) {
        await caches.delete(keys[j]);
      }
      addLog('Deleted ' + cacheCount + ' cache(s): ' + keys.join(', '), true);
    } catch(e) {
      addLog('Cache delete failed: ' + e.message, false);
    }
  } else {
    addLog('No Cache API support', null);
  }

  // 3. Clear localStorage
  try {
    var lsKeys = Object.keys(localStorage);
    var removed = [];
    lsKeys.forEach(function(k) {
      if (k.indexOf('kiko') !== -1 || k.indexOf('custom_favicon') !== -1 || k.indexOf('nav') !== -1) {
        localStorage.removeItem(k);
        removed.push(k);
      }
    });
    addLog('Cleared ' + removed.length + ' localStorage keys', true);
  } catch(e) {
    addLog('localStorage clear failed: ' + e.message, false);
  }

  // 4. Show status
  status.textContent = 'SWs removed: ' + swCount + '\nCaches deleted: ' + cacheCount + '\nTimestamp: ' + new Date().toISOString() + '\nUA: ' + navigator.userAgent.substring(0, 80);

  // 5. Add link to main app
  addLog('Cache cleared. Tap the button below to open Kiko.', null);
  var link = document.createElement('a');
  link.href = '/?v=' + Date.now();
  link.textContent = 'Open Kiko →';
  log.appendChild(link);
}

run();
</script>
</body>
</html>
