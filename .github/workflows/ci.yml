# .github/workflows/ci.yml — Kiko Platform CI
# Runs build smoke tests on every push to main
# Does NOT run API/RLS tests (those need auth credentials)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify critical files exist
        run: |
          test -f api/kiko.js || exit 1
          test -f api/kiko-tools.js || exit 1
          test -f api/kiko-self-knowledge.js || exit 1
          test -f api/calendar-events.js || exit 1
          test -f api/cron-knowledge-seed.js || exit 1
          test -f KIKO_BIBLE.md || exit 1
          test -f ARCHITECTURE.md || exit 1
          test -d dist || exit 1
          echo "All critical files verified"

      - name: Check dist output
        run: |
          test -f dist/index.html || exit 1
          echo "dist/index.html exists"
          ls -la dist/ | head -10
