<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kiko LinkedIn Sync</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    margin: 0;
    padding: 18px;
    width: 320px;
    background: #0d0d0f;
    color: #e5e5e5;
    font-weight: 300;
  }
  .brand {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.15em;
    color: #a78bfa;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .status {
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.4;
  }
  .status.ok { background: rgba(45, 212, 191, 0.08); border: 0.5px solid rgba(45, 212, 191, 0.3); color: #2dd4bf; }
  .status.error { background: rgba(248, 113, 113, 0.08); border: 0.5px solid rgba(248, 113, 113, 0.3); color: #f87171; }
  .status.idle { background: rgba(255, 255, 255, 0.03); border: 0.5px solid rgba(255, 255, 255, 0.06); color: #9ca3af; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 11px; color: #9ca3af; border-bottom: 0.5px solid rgba(255, 255, 255, 0.04); }
  .row:last-of-type { border-bottom: none; margin-bottom: 10px; }
  .row span:last-child { color: #e5e5e5; font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    background: linear-gradient(135deg, #7c5cfc 0%, #a78bfa 100%);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  button.secondary { background: rgba(255, 255, 255, 0.04); border: 0.5px solid rgba(255, 255, 255, 0.08); color: #e5e5e5; }
  button:disabled { opacity: 0.5; cursor: wait; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  .footer { text-align: center; margin-top: 12px; }
  .footer a { font-size: 10px; color: #6b7280; text-decoration: none; letter-spacing: 0.05em; }
  .footer a:hover { color: #a78bfa; }
</style>
</head>
<body>
  <div class="brand">KIKO LINKEDIN SYNC</div>
  <div id="status" class="status idle">Loading…</div>
  <div class="row"><span>Identity</span><span id="identity">—</span></div>
  <div class="row"><span>Last sync</span><span id="lastSync">—</span></div>
  <div class="row"><span>Cookies</span><span id="cookieCount">—</span></div>
  <button id="syncBtn">Sync Now</button>
  <button id="verifyBtn" class="secondary">Test LinkedIn Session</button>
  <div class="footer"><a href="#" id="settingsLink">Settings →</a></div>
  <script src="popup.js"></script>
</body>
</html>
